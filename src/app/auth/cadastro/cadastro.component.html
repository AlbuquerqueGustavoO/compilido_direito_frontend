<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__brand">
      <img src="assets/imagens/logo-marca-2.png" alt="Compilado de Leis" />
      <span>Compilado de Leis</span>
    </div>

    <h1 class="auth-card__title">Criar conta</h1>
    <p class="auth-card__subtitle">Leva menos de um minuto.</p>

    <p class="auth-alert auth-alert--error" *ngIf="erro">{{ erro }}</p>

    <form [formGroup]="form" (ngSubmit)="cadastrar()" novalidate>
      <div class="auth-field">
        <label for="nome">Nome</label>
        <input id="nome" type="text" formControlName="nome" autocomplete="name" placeholder="Seu nome">
        <small class="auth-field__error" *ngIf="nome?.invalid && nome?.touched">
          <span *ngIf="nome?.errors?.['required']">Informe seu nome.</span>
          <span *ngIf="nome?.errors?.['minlength']">O nome deve ter ao menos 3 caracteres.</span>
        </small>
      </div>

      <div class="auth-field">
        <label for="sobre">Sobre você (opcional)</label>
        <input id="sobre" type="text" formControlName="sobre" placeholder="Uma breve descrição">
      </div>

      <div class="auth-field">
        <label for="email">E-mail</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" placeholder="voce@email.com">
        <small class="auth-field__error" *ngIf="email?.invalid && email?.touched">
          <span *ngIf="email?.errors?.['required']">Informe seu e-mail.</span>
          <span *ngIf="email?.errors?.['email']">E-mail inválido.</span>
        </small>
      </div>

      <div class="auth-field">
        <label for="senha">Senha</label>
        <input id="senha" type="password" formControlName="senha" autocomplete="new-password" placeholder="••••••">
        <small class="auth-field__error" *ngIf="senha?.invalid && senha?.touched">
          <span *ngIf="senha?.errors?.['required']">Informe uma senha.</span>
          <span *ngIf="senha?.errors?.['minlength']">A senha deve ter ao menos 6 caracteres.</span>
        </small>
      </div>

      <div class="auth-field">
        <label for="confirmarSenha">Confirmar senha</label>
        <input id="confirmarSenha" type="password" formControlName="confirmarSenha" autocomplete="new-password" placeholder="••••••">
        <small class="auth-field__error" *ngIf="confirmarSenha?.touched && (confirmarSenha?.errors?.['required'] || form.errors?.['senhasDiferentes'])">
          <span *ngIf="confirmarSenha?.errors?.['required']">Confirme sua senha.</span>
          <span *ngIf="form.errors?.['senhasDiferentes']">As senhas não coincidem.</span>
        </small>
      </div>

      <button type="submit" class="auth-submit" [disabled]="enviando">
        {{ enviando ? 'Criando conta...' : 'Criar conta' }}
      </button>
    </form>

    <p class="auth-card__footer">
      Já tem conta? <a routerLink="/auth/login">Entrar</a>
    </p>
  </div>
</div>
