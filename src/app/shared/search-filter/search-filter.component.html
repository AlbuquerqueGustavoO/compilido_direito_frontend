<div class="search-filter-container">
  <!-- Search button bar (fixed position) -->
  <div class="container containerFind mt-3">
    <div class="row" style="position: relative;">
      <div class="col-sm-12 search-container-parent">
        <div class="search-container-body">
          <button class="btn toggle-search-button" (click)="toggleSearch()">
            <i class="fas fa-search"></i>
          </button>
          <div class="search-container" [ngClass]="{'visible': isSearchVisible}">
            <input 
              type="text" 
              class="form-control search-input" 
              [(ngModel)]="termoPesquisa"
              placeholder="Pesquisar" 
              (keyup.enter)="pesquisar()" 
              (ngModelChange)="onTermoPesquisaChange($event)">
            <button class="btn search-button" (click)="pesquisar()">
              <i class="fas fa-search"></i>
            </button>
            <button class="btn search-button" (click)="pesquisarProximaOcorrencia()">
              <i class="fas fa-chevron-up"></i>
            </button>
            <button class="btn search-button" (click)="pesquisarOcorrenciaAnterior()">
              <i class="fas fa-chevron-down"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Alternative search bar (visible below header) -->
  <div class="container mt-3">
    <div class="row">
      <div class="col search-container-alt" style="display: flex;">
        <input 
          type="text" 
          class="form-control search-input" 
          [(ngModel)]="termoPesquisa" 
          placeholder="Digite sua pesquisa aqui" 
          (keyup.enter)="pesquisar()"
          (ngModelChange)="onTermoPesquisaChange($event)">
        <button class="btn search-button" (click)="pesquisar()">Pesquisar</button>
        <button class="btn search-button" (click)="pesquisarProximaOcorrencia()">
          <i class="fas fa-chevron-up"></i>
        </button>
        <button class="btn search-button" (click)="pesquisarOcorrenciaAnterior()">
          <i class="fas fa-chevron-down"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Search results info -->
  <div class="search-info" *ngIf="termoPesquisa.length > 2 && ocorrencias.length > 0">
    <small class="text-muted">
      {{ ocorrenciaAtual + 1 }} de {{ ocorrencias.length }} resultado(s)
    </small>
  </div>
</div>
