<header class="topbar">
  <button type="button" class="topbar__toggle" aria-label="Abrir/fechar menu" (click)="toggleSidebar.emit()">
    <i class="fa-solid fa-bars"></i>
  </button>

  <div class="topbar__spacer"></div>

  <div class="topbar__user">
    <button type="button" class="topbar__avatar" [attr.title]="(usuarioAtual$ | async)?.nome"
      (click)="toggleMenu()">{{ iniciais$ | async }}</button>

    <div class="topbar__menu" *ngIf="menuAberto">
      <div class="topbar__menu-info">
        <strong>{{ (usuarioAtual$ | async)?.nome }}</strong>
        <span>{{ (usuarioAtual$ | async)?.email }}</span>
      </div>
      <button type="button" class="topbar__menu-sair" (click)="sair()">
        <i class="fa-solid fa-right-from-bracket"></i> Sair
      </button>
    </div>
  </div>
</header>

<div class="topbar__backdrop" *ngIf="menuAberto" (click)="fecharMenu()"></div>
