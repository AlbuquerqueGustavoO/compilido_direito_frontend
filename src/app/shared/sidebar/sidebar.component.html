<aside class="sidebar" [class.sidebar--open]="open">
  <div class="sidebar__brand" routerLink="/quemsomos/apresentacao">
    <img src="assets/imagens/logo-marca-2.png" alt="Compilado de Leis" class="sidebar__logo" />
  </div>

  <nav class="sidebar__nav">
    <span class="sidebar__section-label">Conteúdo</span>
    <ul>
      <li class="sidebar__item" *ngFor="let item of navItems">

        <a *ngIf="!item.children" class="sidebar__link" [routerLink]="item.path"
          routerLinkActive="is-active" [routerLinkActiveOptions]="{exact: true}" (click)="onLinkClick()">
          <span class="sidebar__icon"><i [class]="item.icon"></i></span>
          <span class="sidebar__label">{{ item.label }}</span>
        </a>

        <ng-container *ngIf="item.children">
          <button type="button" class="sidebar__link sidebar__group-toggle" [class.is-active]="isGroupActive(item)"
            (click)="toggleGroup(item)">
            <span class="sidebar__icon"><i [class]="item.icon"></i></span>
            <span class="sidebar__label">{{ item.label }}</span>
            <i class="fa-solid fa-chevron-down sidebar__chevron" [class.sidebar__chevron--open]="isGroupOpen(item)"></i>
          </button>

          <ul class="sidebar__subnav" *ngIf="isGroupOpen(item)">
            <li *ngFor="let child of item.children">
              <a class="sidebar__sublink" [routerLink]="child.path" routerLinkActive="is-active"
                [routerLinkActiveOptions]="{exact: true}" (click)="onLinkClick()">{{ child.label }}</a>
            </li>
          </ul>
        </ng-container>

      </li>
    </ul>
  </nav>

  <button type="button" class="sidebar__collapse-toggle" (click)="toggleCollapse.emit()"
    [attr.aria-label]="open ? 'Recolher menu' : 'Expandir menu'">
    <i class="fa-solid fa-chevron-left" [class.sidebar__collapse-toggle-icon--flipped]="!open"></i>
  </button>
</aside>

<div class="sidebar__backdrop" *ngIf="open" (click)="onLinkClick()"></div>
